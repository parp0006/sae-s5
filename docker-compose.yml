services:
  flarum:
    image: crazymax/flarum:latest
    container_name: flarum
    restart: always
    ports:
      - "8080:8000"
    environment:
      - DB_HOST=db
      - DB_USER=flarum
      - DB_PASSWORD=butinfo
      - DB_NAME=flarum
      - DB_PORT=3306
      - FLARUM_BASE_URL=http://10.31.33.3:8080
      - FLARUM_ADMIN_USER=admininfo
      - FLARUM_ADMIN_PASSWORD=admininfo
      - FLARUM_ADMIN_EMAIL=admininfo@example.com
      - FLARUM_FORUM_TITLE=SAE-S5
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: flarum_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=butinfoadmin
      - MYSQL_DATABASE=flarum
      - MYSQL_USER=flarum
      - MYSQL_PASSWORD=butinfo
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ./ollama:/root/.ollama

  bots:
    build: ./bots
    container_name: flarum_bots
    restart: always
    environment:
      - FLARUM_URL=http://flarum:8000
      - FLARUM_KEY=9f97c96fa3eb02fade5f575696a62e0397ac8d541c5f67e5845044e873f91aba
      - LLM_URL=http://ollama:11434/v1/chat/completions
      - MODEL=llama3.2:3b
      - DISCUSSIONS=1
    depends_on:
      - flarum
      - ollama
